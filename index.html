<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大樓物業管理系統 - 統一後台登入</title>
    <style>
        :root { --primary: #1a73e8; --bg: #f4f6f9; --text: #333; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            height: 100vh; 
            justify-content: center; 
            align-items: center; 
            margin: 0;
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            width: 350px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
        }
        .login-box h2 { 
            margin-top: 0; 
            color: var(--primary); 
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .form-control { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
        }
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .btn:hover { opacity: 0.9; }
        .loader { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🏢 物業管理雲端後台</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 25px;">請輸入您的部門帳號與密碼</p>
        
        <div class="form-group">
            <label>登入帳號</label>
            <input type="text" id="inputUsername" class="form-control" placeholder="請輸入帳號" onkeypress="handleEnter(event)">
        </div>
        <div class="form-group">
            <label>登入密碼</label>
            <input type="password" id="inputPassword" class="form-control" placeholder="請輸入密碼" onkeypress="handleEnter(event)">
        </div>
        
        <button class="btn" onclick="window.processLogin()">登 入 系 統</button>
        
        <div id="statusMsg" class="loader">連線初始化中...</div>
    </div>

    <!-- ============================================== -->
    <!-- Firebase SDK 與自動分流邏輯 -->
    <!-- ============================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 🌟 貼上共用的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBq4EKFQ3gjq1kpOWMH5MXosF7O9ENOrjw",
            authDomain: "test-ue-app.firebaseapp.com",
            projectId: "test-ue-app",
            storageBucket: "test-ue-app.firebasestorage.app",
            messagingSenderId: "203707145209",
            appId: "1:203707145209:web:647068d7d0e4b843b47b28"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let dbUsers = {};

        // 監聽雲端帳號資料
        onSnapshot(collection(db, "users"), (snapshot) => {
            dbUsers = {}; 
            snapshot.forEach(doc => { dbUsers[doc.id] = doc.data(); });
            document.getElementById('statusMsg').innerText = "🟢 系統連線正常，請登入";
        });

        // 進入網頁時，檢查是否已經登入過了，如果登入過就自動跳轉
        window.onload = function() {
            const userStr = localStorage.getItem('cloudCurrentUser');
            if (userStr) {
                document.getElementById('statusMsg').innerText = "⏳ 偵測到已登入，正在為您跳轉...";
                autoRedirect(JSON.parse(userStr).role);
            }
        };

        // 按 Enter 鍵直接登入
        window.handleEnter = function(e) {
            if (e.key === 'Enter') window.processLogin();
        };

        // 驗證帳號密碼
        window.processLogin = function() {
            const un = document.getElementById('inputUsername').value.trim();
            const pw = document.getElementById('inputPassword').value.trim();
            
            if (!un || !pw) { alert("請輸入帳號與密碼！"); return; }
            
            if (dbUsers[un] && dbUsers[un].password === pw) {
                const role = dbUsers[un].role;
                
                // 防呆：禁止一般巡邏保全 (user) 登入這個後台入口
                if (role === 'user') {
                    alert("⚠️ 權限不足！一般巡邏員請使用「手機端專屬 APP」網址登入。");
                    return;
                }

                // 將登入憑證存入本機
                const currentUser = { username: un, role: role, name: dbUsers[un].name };
                localStorage.setItem('cloudCurrentUser', JSON.stringify(currentUser));
                
                document.getElementById('statusMsg').innerText = "✅ 登入成功，正在跳轉...";
                
                // 呼叫自動跳轉
                autoRedirect(role);
            } else { 
                alert("❌ 帳號或密碼錯誤！請重新輸入。"); 
            }
        };

        // 🚨 核心分流樞紐 (Routing)
        function autoRedirect(role) {
            if (role === 'admin' || role === 'sub_admin') {
                window.location.replace('admin_dashboard.html');
            } else if (role === 'engineering') {
                window.location.replace('engineering.html');
            } else if (role === 'cleaning') {
                window.location.replace('cleaning.html');
            } else {
                alert("未知的權限設定，請聯絡系統管理員。");
                localStorage.removeItem('cloudCurrentUser');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
