<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大樓物業管理系統 - 統一後台登入</title>
    <style>
        :root { --primary: #1a73e8; --bg: #f4f6f9; --text: #333; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            display: flex; 
            height: 100vh; 
            justify-content: center; 
            align-items: center; 
            margin: 0;
        }
        .login-box { 
            background: white; 
            padding: 40px; 
            border-radius: 12px; 
            width: 350px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            text-align: center;
        }
        .login-box h2 { 
            margin-top: 0; 
            color: var(--primary); 
            margin-bottom: 20px;
        }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 14px; }
        .form-control { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
        }
        .btn { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .btn:hover { opacity: 0.9; }
        .loader { font-size: 12px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🏢 物業管理雲端後台</h2>
        <p style="font-size: 14px; color: #666; margin-bottom: 25px;">請輸入您的部門帳號與密碼</p>
        
        <div class="form-group">
            <label>登入帳號</label>
            <!-- 提示使用者只需輸入短帳號 -->
            <input type="text" id="inputUsername" class="form-control" placeholder="例如: admin, clean, engineering" onkeypress="handleEnter(event)">
        </div>
        <div class="form-group">
            <label>登入密碼</label>
            <input type="password" id="inputPassword" class="form-control" placeholder="請輸入密碼" onkeypress="handleEnter(event)">
        </div>
        
        <button class="btn" onclick="window.processLogin()" id="loginBtn">登 入 系 統</button>
        
        <div id="statusMsg" class="loader">連線初始化中...</div>
    </div>

    <!-- ============================================== -->
    <!-- Firebase SDK 與企業級身分驗證邏輯 -->
    <!-- ============================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        // 🚨 匯入 getAuth, signInWithEmailAndPassword, onAuthStateChanged (登入引擎三劍客)
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        // 匯入 getFirestore (查詢權限用)
        import { getFirestore, doc, getDoc } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 🌟 貼上共用的 Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBq4EKFQ3gjq1kpOWMH5MXosF7O9ENOrjw",
            authDomain: "test-ue-app.firebaseapp.com",
            projectId: "test-ue-app",
            storageBucket: "test-ue-app.firebasestorage.app",
            messagingSenderId: "203707145209",
            appId: "1:203707145209:web:647068d7d0e4b843b47b28"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 定義你們大樓的「虛擬信箱網域」
        const VIRTUAL_DOMAIN = "@patrol.com";

        // 監聽登入狀態 (如果已經有合法的 Token，就自動查身分並跳轉)
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('statusMsg').innerText = "⏳ 驗證成功，正在讀取權限...";
                // 從 Firestore 查出這個人真正的權限 (role)
                const userDoc = await getDoc(doc(db, "users", user.email.replace(VIRTUAL_DOMAIN, '')));
                if (userDoc.exists()) {
                    const role = userDoc.data().role;
                    autoRedirect(role);
                } else {
                    document.getElementById('statusMsg').innerText = "❌ 權限異常，請聯絡管理員";
                    auth.signOut();
                }
            } else {
                document.getElementById('statusMsg').innerText = "🟢 系統連線正常，請登入";
            }
        });

        // 按 Enter 鍵直接登入
        window.handleEnter = function(e) {
            if (e.key === 'Enter') window.processLogin();
        };

        // 驗證帳號密碼
        window.processLogin = async function() {
            const un = document.getElementById('inputUsername').value.trim().toLowerCase();
            const pw = document.getElementById('inputPassword').value.trim();
            const btn = document.getElementById('loginBtn');
            const msg = document.getElementById('statusMsg');
            
            if (!un || !pw) { alert("請輸入帳號與密碼！"); return; }
            
            btn.disabled = true;
            btn.innerText = "驗證中...";
            msg.innerText = "🔐 正在與 Firebase 伺服器進行安全連線...";

            // 🎩 魔術發生地：自動將短帳號補齊成虛擬信箱格式
            const virtualEmail = `${un}${VIRTUAL_DOMAIN}`;

            try {
                // 呼叫 Firebase 伺服器進行加密驗證
                await signInWithEmailAndPassword(auth, virtualEmail, pw);
                // 成功的話，上面的 onAuthStateChanged 會接手處理後續跳轉
            } catch (error) {
                console.error("登入錯誤代碼:", error.code);
                btn.disabled = false;
                btn.innerText = "登 入 系 統";
                
                // 判斷常見錯誤
                if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    alert("❌ 帳號或密碼錯誤！\n(請確認該帳號已在管理後台建立)");
                } else {
                    alert(`❌ 登入失敗：${error.message}`);
                }
                msg.innerText = "🔴 請重新登入";
            }
        };

        // 🚨 核心分流樞紐 (Routing)
        function autoRedirect(role) {
            // 防呆：禁止一般巡邏保全 (user) 登入這個後台入口
            if (role === 'user') {
                alert("⚠️ 權限不足！一般巡邏員請使用「手機端專屬 APP」網址登入。");
                auth.signOut();
                return;
            }

            if (role === 'admin' || role === 'sub_admin') {
                window.location.replace('admin_dashboard.html');
            } else if (role === 'engineering') {
                window.location.replace('engineering.html');
            } else if (role === 'cleaning') {
                window.location.replace('cleaning.html');
            } else {
                alert("未知的權限設定，請聯絡管理員。");
                auth.signOut();
                window.location.reload();
            }
        }
    </script>
</body>
</html>
